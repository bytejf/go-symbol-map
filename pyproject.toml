[project]
name = "go-symbol-map"
version = "0.1.0"
description = "Map diff hunks in Go files to the functions they belong to. AST-based, not regex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "bytejf" }]
keywords = ["go", "golang", "tree-sitter", "ast", "diff", "hunk", "code-review", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    # **上界是必需的，不是随手钉的**：tree-sitter 0.26 运行时配 tree-sitter-go
    # 0.25.0 的 grammar 在原生层不兼容，解析稍大的真实 Go 文件会 SIGSEGV
    # （实测 41KB 的文件必崩）。tree-sitter-go 至今停在 0.25.0，等它发 0.26
    # 配套版之后再去掉上界
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.25.0",
]

[project.urls]
Repository = "https://github.com/bytejf/go-symbol-map"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go_symbol_map"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# 注释与文档用中文写，全角标点（，。：；）会命中「容易与 ASCII 混淆」那三条。
# 它们防的是「用长得像 ASCII 的字符冒充 ASCII」，而这里就是中文，不适用
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
